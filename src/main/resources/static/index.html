<!doctype html>
<html lang="id" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hevy PBO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen">

<!-- Sidebar -->
<aside class="sidebar fixed top-0 left-0 h-full w-64 bg-[#141414] border-r border-white/5 flex flex-col z-50">
    <div class="p-6 border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-[#e63946] flex items-center justify-center font-bold text-sm" style="font-family:'Syne',sans-serif;">H</div>
            <span class="font-bold text-base tracking-tight" style="font-family:'Syne',sans-serif;">Hevy PBO</span>
        </div>
    </div>

    <nav class="flex-1 p-4 space-y-1">
        <a href="/" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5v14M6 8H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 12h12"/></svg>
            Library
        </a>
        <a href="/workout.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Workout
        </a>
        <a href="/history.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            History
        </a>
        <a href="/admin.html" id="adminLink" class="nav-item hidden flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Admin
        </a>
    </nav>

    <div class="p-4 border-t border-white/5">
        <p class="text-xs text-white/30 uppercase tracking-widest mb-1">Logged in as</p>
        <p id="usernameLabel" class="text-sm font-semibold text-white/80">-</p>
        <button onclick="handleLogout()" class="mt-3 w-full btn-ghost py-2 rounded-lg text-xs font-semibold">Logout</button>
        <input id="userIdInput" type="hidden" value="0">
    </div>
</aside>

<!-- Main -->
<main class="ml-64 min-h-screen flex flex-col">

    <!-- Top bar -->
    <header class="sticky top-0 z-40 bg-[#0f0f0f]/80 backdrop-blur border-b border-white/5 px-8 py-4 flex items-center justify-between">
        <div>
            <p class="text-xs text-white/30 uppercase tracking-widest mb-0.5">Dashboard</p>
            <h1 class="text-lg font-bold tracking-tight" style="font-family:'Syne',sans-serif;">Exercise Library</h1>
        </div>
        <div class="flex items-center gap-3">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input id="searchInput" type="search" placeholder="Cari exercise..."
                       class="pl-9 pr-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm text-white placeholder-white/30 focus:outline-none focus:border-[#e63946]/60 w-56 transition-colors">
            </div>
            <select id="muscleFilter" class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white/70 focus:outline-none focus:border-[#e63946]/60 transition-colors">
                <option value="">Semua Muscle</option>
                <option value="chest">Chest</option>
                <option value="back">Back</option>
                <option value="shoulders">Shoulders</option>
                <option value="biceps">Biceps</option>
                <option value="triceps">Triceps</option>
                <option value="quad">Quad</option>
                <option value="hamstring">Hamstring</option>
                <option value="core">Core</option>
                <option value="other">Other</option>
            </select>
            <button id="refreshButton" class="btn-ghost px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/></svg>
                Refresh
            </button>
            <button onclick="openModal()" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Custom Exercise
            </button>
        </div>
    </header>

    <!-- Stats -->
    <section class="px-8 pt-6 grid grid-cols-3 gap-4">
        <div class="stat-card rounded-xl p-5 border border-white/5">
            <p class="text-xs text-white/30 uppercase tracking-widest mb-2">Total Exercise</p>
            <p id="totalCount" class="text-3xl font-bold" style="font-family:'Syne',sans-serif;">0</p>
        </div>
        <div class="stat-card rounded-xl p-5 border border-white/5">
            <p class="text-xs text-white/30 uppercase tracking-widest mb-2">Strength</p>
            <p id="strengthCount" class="text-3xl font-bold text-[#e63946]" style="font-family:'Syne',sans-serif;">0</p>
        </div>
        <div class="stat-card rounded-xl p-5 border border-white/5">
            <p class="text-xs text-white/30 uppercase tracking-widest mb-2">Cardio</p>
            <p id="cardioCount" class="text-3xl font-bold text-[#4cc9f0]" style="font-family:'Syne',sans-serif;">0</p>
        </div>
    </section>

    <!-- Exercise table -->
    <section class="px-8 pt-6 pb-8">
        <div class="bg-[#141414] border border-white/5 rounded-xl overflow-hidden">
            <div id="statusMessage" class="px-5 py-3 text-xs text-white/30 border-b border-white/5">Memuat library...</div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                    <tr class="border-b border-white/5">
                        <th class="px-5 py-3 text-left text-xs font-semibold text-white/30 uppercase tracking-widest">Nama</th>
                        <th class="px-5 py-3 text-left text-xs font-semibold text-white/30 uppercase tracking-widest">Kategori</th>
                        <th class="px-5 py-3 text-left text-xs font-semibold text-white/30 uppercase tracking-widest">Muscle</th>
                        <th class="px-5 py-3 text-left text-xs font-semibold text-white/30 uppercase tracking-widest">Equipment</th>
                        <th class="px-5 py-3 text-left text-xs font-semibold text-white/30 uppercase tracking-widest">Scope</th>
                        <th class="px-5 py-3 text-left text-xs font-semibold text-white/30 uppercase tracking-widest">Aksi</th>
                    </tr>
                    </thead>
                    <tbody id="exerciseTableBody"></tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<!-- Modal tambah custom exercise -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="relative bg-[#1a1a1a] border border-white/10 rounded-2xl w-full max-w-md mx-4 overflow-hidden">
        <div class="px-6 py-5 border-b border-white/5 flex items-center justify-between">
            <div>
                <p class="text-xs text-white/30 uppercase tracking-widest mb-0.5">Library</p>
                <h2 class="text-base font-bold" style="font-family:'Syne',sans-serif;">Custom Exercise</h2>
            </div>
            <button onclick="closeModal()" class="text-white/30 hover:text-white transition-colors">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="px-6 py-5 space-y-4">
            <div>
                <label class="text-xs text-white/40 uppercase tracking-widest block mb-2">Nama Exercise</label>
                <input id="exName" type="text" placeholder="Contoh: Cable Fly"
                       class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white placeholder-white/20 focus:outline-none focus:border-[#e63946]/60 transition-colors">
            </div>
            <div>
                <label class="text-xs text-white/40 uppercase tracking-widest block mb-2">Kategori</label>
                <select id="exCategory" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#e63946]/60 transition-colors">
                    <option value="strength">Strength</option>
                    <option value="cardio">Cardio</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-white/40 uppercase tracking-widest block mb-2">Muscle Group</label>
                <select id="exMuscle" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#e63946]/60 transition-colors">
                    <option value="chest">Chest</option>
                    <option value="back">Back</option>
                    <option value="shoulders">Shoulders</option>
                    <option value="biceps">Biceps</option>
                    <option value="triceps">Triceps</option>
                    <option value="quad">Quad</option>
                    <option value="hamstring">Hamstring</option>
                    <option value="core">Core</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-white/40 uppercase tracking-widest block mb-2">Equipment</label>
                <select id="exEquipment" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#e63946]/60 transition-colors">
                    <option value="barbell">Barbell</option>
                    <option value="dumbbell">Dumbbell</option>
                    <option value="machine">Machine</option>
                    <option value="cable">Cable</option>
                    <option value="bodyweight">Bodyweight</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <p id="modalError" class="text-xs text-[#e63946] min-h-4"></p>
        </div>
        <div class="px-6 pb-6 flex gap-3">
            <button onclick="closeModal()" class="flex-1 btn-ghost py-2.5 rounded-xl text-sm font-semibold">Batal</button>
            <button onclick="submitCustomExercise()" class="flex-1 btn-primary py-2.5 rounded-xl text-sm font-semibold">Simpan</button>
        </div>
    </div>
</div>

<script src="/app.js"></script>

<script>
    function handleLogout() {
        fetch("/api/auth/logout", { method: "POST" })
            .then(() => { window.location.href = "/login.html"; });
    }

    function openModal() {
        document.getElementById("modal").classList.remove("hidden");
        document.getElementById("modalError").textContent = "";
        document.getElementById("exName").value = "";
    }

    function closeModal() {
        document.getElementById("modal").classList.add("hidden");
    }

    // init
    (async () => {
        const res = await fetch("/api/auth/me");
        if (!res.ok) { window.location.href = "/login.html"; return; }
        const user = await res.json();

        if (user.role === "admin") {
            window.location.href = "/admin.html";
            return;
        }

        document.getElementById("userIdInput").value = user.id;
        document.getElementById("usernameLabel").textContent = user.username;

        initLibrary(user.id);
    })();
</script>

</body>
</html>
