<!doctype html>
<html lang="id" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hevy PBO — History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen">

<!-- Sidebar -->
<aside class="sidebar fixed top-0 left-0 h-full w-64 bg-[#141414] border-r border-white/5 flex flex-col z-50">
    <div class="p-6 border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-[#e63946] flex items-center justify-center font-bold text-sm" style="font-family:'Syne',sans-serif;">H</div>
            <span class="font-bold text-base tracking-tight" style="font-family:'Syne',sans-serif;">Hevy PBO</span>
        </div>
    </div>

    <nav class="flex-1 p-4 space-y-1">
        <a href="/" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5v14M6 8H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 12h12"/></svg>
            Library
        </a>
        <a href="/workout.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Workout
        </a>
        <a href="/history.html" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            History
        </a>
    </nav>

    <div class="p-4 border-t border-white/5">
        <p class="text-xs text-white/30 uppercase tracking-widest mb-1">Logged in as</p>
        <p id="usernameLabel" class="text-sm font-semibold text-white/80">-</p>
        <button onclick="handleLogout()" class="mt-3 w-full btn-ghost py-2 rounded-lg text-xs font-semibold">Logout</button>
    </div>
</aside>

<!-- Main -->
<main class="ml-64 min-h-screen flex flex-col">

    <!-- Top bar -->
    <header class="sticky top-0 z-40 bg-[#0f0f0f]/80 backdrop-blur border-b border-white/5 px-8 py-4 flex items-center justify-between">
        <div>
            <p class="text-xs text-white/30 uppercase tracking-widest mb-0.5">Riwayat</p>
            <h1 class="text-lg font-bold tracking-tight" style="font-family:'Syne',sans-serif;">Workout History</h1>
        </div>
        <a href="/workout.html" class="btn-primary px-5 py-2 rounded-lg text-sm font-semibold">
            + New Workout
        </a>
    </header>

    <!-- Stats -->
    <section class="px-8 pt-6 grid grid-cols-3 gap-4">
        <div class="stat-card rounded-xl p-5 border border-white/5">
            <p class="text-xs text-white/30 uppercase tracking-widest mb-2">Total Sesi</p>
            <p id="totalSessions" class="text-3xl font-bold" style="font-family:'Syne',sans-serif;">0</p>
        </div>
        <div class="stat-card rounded-xl p-5 border border-white/5">
            <p class="text-xs text-white/30 uppercase tracking-widest mb-2">Total Exercise</p>
            <p id="totalExercises" class="text-3xl font-bold text-[#e63946]" style="font-family:'Syne',sans-serif;">0</p>
        </div>
        <div class="stat-card rounded-xl p-5 border border-white/5">
            <p class="text-xs text-white/30 uppercase tracking-widest mb-2">Total Set</p>
            <p id="totalSets" class="text-3xl font-bold text-[#4cc9f0]" style="font-family:'Syne',sans-serif;">0</p>
        </div>
    </section>

    <!-- History list -->
    <section class="px-8 pt-6 pb-8 flex gap-6 items-start">

        <!-- Session list -->
        <div class="flex-1 min-w-0 space-y-3">
            <div id="loadingState" class="bg-[#141414] border border-white/5 rounded-xl px-5 py-8 text-center text-xs text-white/30">
                Memuat riwayat...
            </div>
            <div id="emptyState" class="hidden bg-[#141414] border border-white/5 rounded-xl px-5 py-12 text-center">
                <p class="text-white/20 text-sm">Belum ada riwayat workout.</p>
                <p class="text-white/10 text-xs mt-1">Selesaikan sesi pertamamu!</p>
                <a href="/workout.html" class="inline-block mt-4 btn-primary px-5 py-2 rounded-lg text-xs font-semibold">Mulai Workout</a>
            </div>
            <div id="sessionList" class="space-y-3"></div>
        </div>

        <!-- Detail panel -->
        <aside class="w-80 shrink-0 sticky top-24">
            <div id="detailPanel" class="bg-[#141414] border border-white/5 rounded-xl overflow-hidden">
                <div class="px-5 py-8 text-center">
                    <p class="text-white/20 text-sm">Pilih sesi untuk melihat detail.</p>
                </div>
            </div>
        </aside>

    </section>

</main>

<script>
    let userId = 1;
    let sessions = [];

    const $ = (id) => document.getElementById(id);

    async function handleLogout() {
      await fetch("/api/auth/logout", { method: "POST" });
      window.location.href = "/login.html";
    }

    // fetch data

    async function loadHistory() {
      try {
        const res = await fetch(`/api/workouts?userId=${userId}`);
        if (!res.ok) throw new Error();
        sessions = await res.json();
        renderList();
      } catch {
        $("loadingState").textContent = "Gagal memuat riwayat.";
      }
    }


    function renderList() {
      $("loadingState").classList.add("hidden");

      // Hanya tampilkan sesi yang sudah selesai (finished_at tidak null)
      const finished = sessions.filter((s) => s.finishedAt);

      if (finished.length === 0) {
        $("emptyState").classList.remove("hidden");
        return;
      }

      // Hitung stats
      const totalEx  = finished.reduce((acc, s) => acc + (s.exercises?.length ?? 0), 0);
      const totalSet = finished.reduce((acc, s) =>
        acc + (s.exercises?.reduce((a, e) => a + (e.sets?.length ?? 0), 0) ?? 0), 0);

      $("totalSessions").textContent  = finished.length;
      $("totalExercises").textContent = totalEx;
      $("totalSets").textContent      = totalSet;

      const container = $("sessionList");
      container.innerHTML = "";
      finished.forEach((session) => container.append(buildSessionCard(session)));
    }

    function buildSessionCard(session) {
      const started  = new Date(session.startedAt);
      const finished = session.finishedAt ? new Date(session.finishedAt) : null;
      const duration = finished
        ? Math.round((finished - started) / 60000)
        : 0;

      const exCount  = session.exercises?.length ?? 0;
      const setCount = session.exercises?.reduce((a, e) => a + (e.sets?.length ?? 0), 0) ?? 0;

      const card = document.createElement("div");
      card.className = "bg-[#141414] border border-white/5 rounded-xl px-5 py-4 cursor-pointer hover:border-white/10 transition-colors";
      card.innerHTML = `
        <div class="flex items-start justify-between mb-3">
          <div>
            <p class="text-sm font-semibold text-white/90">
              ${esc(started.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}
            </p>
            <p class="text-xs text-white/30 mt-0.5">${esc(started.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }))}</p>
          </div>
          <span class="text-xs text-white/30 bg-white/5 px-2 py-1 rounded">${duration} menit</span>
        </div>
        <div class="flex gap-4 text-xs text-white/40">
          <span>${exCount} exercise</span>
          <span>${setCount} set</span>
          ${session.notes ? `<span class="truncate max-w-[160px]">"${esc(session.notes)}"</span>` : ""}
        </div>
        ${exCount > 0 ? `
        <div class="mt-3 flex flex-wrap gap-1.5">
          ${(session.exercises ?? []).slice(0, 4).map((ex) =>
            `<span class="text-xs bg-white/5 text-white/40 px-2 py-0.5 rounded">${esc(ex.exerciseNameSnapshot)}</span>`
          ).join("")}
          ${exCount > 4 ? `<span class="text-xs text-white/20">+${exCount - 4} lainnya</span>` : ""}
        </div>` : ""}
      `;

      card.addEventListener("click", () => renderDetail(session));
      return card;
    }


    function renderDetail(session) {
      // Highlight card yang dipilih
      document.querySelectorAll("#sessionList > div").forEach((c) =>
        c.classList.remove("border-[#e63946]/40")
      );
      event.currentTarget.classList.add("border-[#e63946]/40");

      const started  = new Date(session.startedAt);
      const finished = session.finishedAt ? new Date(session.finishedAt) : null;
      const duration = finished ? Math.round((finished - started) / 60000) : 0;

      const panel = $("detailPanel");
      panel.innerHTML = `
        <!-- Header -->
        <div class="px-5 py-4 border-b border-white/5">
          <p class="text-xs text-white/30 uppercase tracking-widest mb-1">Detail Sesi</p>
          <p class="text-base font-bold" style="font-family:'Syne',sans-serif;">
            ${esc(started.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }))}
          </p>
          <p class="text-xs text-white/30 mt-1">${duration} menit · ${session.exercises?.length ?? 0} exercise</p>
        </div>

        <!-- Notes -->
        ${session.notes ? `
        <div class="px-5 py-3 border-b border-white/5">
          <p class="text-xs text-white/30 uppercase tracking-widest mb-1">Notes</p>
          <p class="text-sm text-white/60 italic">"${esc(session.notes)}"</p>
        </div>` : ""}

        <!-- Exercise detail -->
        <div class="divide-y divide-white/5 max-h-[calc(100vh-380px)] overflow-y-auto">
          ${(session.exercises ?? []).map((ex) => `
            <div class="px-5 py-4">
              <p class="text-sm font-semibold text-white/90 mb-2">${esc(ex.exerciseNameSnapshot)}</p>
              ${ex.sets?.length > 0 ? `
                <div class="space-y-1">
                  <div class="grid grid-cols-3 text-xs text-white/30 mb-1">
                    <span>Set</span><span>KG</span><span>Reps</span>
                  </div>
                  ${ex.sets.map((set) => `
                    <div class="grid grid-cols-3 text-xs text-white/60 py-1 border-b border-white/5 last:border-0">
                      <span>${esc(set.setNumber)}</span>
                      <span>${esc(set.weightKg)} kg</span>
                      <span>${esc(set.reps)} reps</span>
                    </div>
                  `).join("")}
                </div>
              ` : `<p class="text-xs text-white/20">Tidak ada set.</p>`}
            </div>
          `).join("")}
        </div>
      `;
    }

    // helper

    function esc(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // init

    (async () => {
      const res = await fetch("/api/auth/me");
      if (!res.ok) { window.location.href = "/login.html"; return; }
      const user = await res.json();
      userId = user.id;
      $("usernameLabel").textContent = user.username;
      await loadHistory();
    })();
</script>

</body>
</html>
